# HTTP bootstrap configuration. Certbot adds TLS and HTTP redirects after DNS resolves.
server {
    listen 80;
    listen [::]:80;
    server_name 786.zohaibkhalid.me;
    server_tokens off;
    client_max_body_size 26m;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location = /api/health { include /etc/nginx/snippets/786-proxy.conf; proxy_pass http://127.0.0.1:3000; }
    location = /api/revalidate { include /etc/nginx/snippets/786-proxy.conf; proxy_pass http://127.0.0.1:3000; }
    location ^~ /api/admin { return 404; }
    location ^~ /api/ { include /etc/nginx/snippets/786-proxy.conf; proxy_pass http://127.0.0.1:8080; }
    location / { include /etc/nginx/snippets/786-proxy.conf; proxy_pass http://127.0.0.1:3000; }
}
server {
    listen 80;
    listen [::]:80;
    server_name 786-admin.zohaibkhalid.me;
    server_tokens off;
    client_max_body_size 26m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    # Proxy uploads and auth directly; secure cookies stay on the admin origin.
    location ^~ /api/admin/ { include /etc/nginx/snippets/786-proxy.conf; proxy_pass http://127.0.0.1:8080; }
    location / { include /etc/nginx/snippets/786-proxy.conf; proxy_pass http://127.0.0.1:3001; }
}
